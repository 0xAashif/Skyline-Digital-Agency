  <rect x="36" y="104" width="430" height="132" rx="16" fill="url(#cardSurface)" stroke="url(#tealStroke)" stroke-width="1.5"/>
  <rect x="56" y="124" width="44" height="44" rx="10" fill="#49C5B6" fill-opacity="0.15" stroke="#49C5B6"/>
