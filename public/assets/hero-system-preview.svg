<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="960" y2="600" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0B131E"/>
      <stop offset="55%" stop-color="#0E1726"/>
      <stop offset="100%" stop-color="#091D24"/>
    </linearGradient>
    <radialGradient id="tealAura" cx="70%" cy="30%" r="55%">
      <stop offset="0%" stop-color="#49C5B6" stop-opacity="0.32"/>
      <stop offset="60%" stop-color="#0D9488" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#0B131E" stop-opacity="0"/>
