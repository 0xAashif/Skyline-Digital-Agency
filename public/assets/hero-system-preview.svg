    <rect x="62" y="102" width="44" height="108" rx="6" fill="#1E293B" stroke="#334155"/>
    <rect x="124" y="74" width="44" height="136" rx="6" fill="#0D9488" fill-opacity="0.35" stroke="#49C5B6"/>
