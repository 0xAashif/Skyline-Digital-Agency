    <path d="M 22 115 L 84 88 L 146 62 L 208 26 L 270 -2 L 334 -28" fill="none" stroke="#F8FAFC" stroke-width="3.5" stroke-linecap="round"/>
    <circle cx="22" cy="115" r="5" fill="#49C5B6" stroke="#0F172A" stroke-width="2"/>
    <circle cx="84" cy="88" r="5" fill="#49C5B6" stroke="#0F172A" stroke-width="2"/>
    <circle cx="146" cy="62" r="5" fill="#49C5B6" stroke="#0F172A" stroke-width="2"/>
    <circle cx="208" cy="26" r="5" fill="#49C5B6" stroke="#0F172A" stroke-width="2"/>
    <circle cx="270" cy="-2" r="5" fill="#49C5B6" stroke="#0F172A" stroke-width="2"/>
    <circle cx="334" cy="-28" r="7" fill="#F8FAFC" stroke="#49C5B6" stroke-width="3"/>
  </g>

  <!-- Bottom KPI Chips inside Right Card -->
  <rect x="524" y="476" width="178" height="58" rx="12" fill="#0F172A" stroke="#334155"/>
  <text x="540" y="498" fill="#94A3B8" font-family="monospace" font-size="10">CORE WEB VITALS</text>
  <text x="540" y="520" fill="#49C5B6" font-family="monospace" font-size="16" font-weight="700">99 / 100 PASS</text>

  <rect x="716" y="476" width="178" height="58" rx="12" fill="#0F172A" stroke="#334155"/>
  <text x="732" y="498" fill="#94A3B8" font-family="monospace" font-size="10">WHATSAPP AI SLA</text>
