  <text x="56" y="358" fill="#94A3B8" font-family="sans-serif" font-size="13">Zero-bloat SSR storefront &amp; conversion funnels with 99+ Web Vitals.</text>
  <rect x="346" y="282" width="100" height="24" rx="6" fill="#0F172A" stroke="#334155"/>
  <text x="358" y="298" fill="#F8FAFC" font-family="monospace" font-size="11" font-weight="700">99/100 CWV</text>

